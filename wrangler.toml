name = "pipelineframework-census"
main = "src/worker.js"
compatibility_date = "2026-10-04"
workers_dev = false
preview_urls = false
# Add the website route only after the privacy and ownership release gates.
[vars]
INGESTION_ENABLED = "false"
[observability]
enabled = false
[triggers]
crons = ["17 3 * * *"]
[[d1_databases]]
binding = "CENSUS_DB"
database_name = "census"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1001"
simple = { limit = 1000, period = 60 }
