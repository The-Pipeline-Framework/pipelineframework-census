name: Census protocol and collector
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  TPF_CENSUS_ENABLED: "false"
  WRANGLER_SEND_METRICS: "false"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
